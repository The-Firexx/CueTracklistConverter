<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cue to LRC Converter</title>
    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #6e7bff, #b7d8ff); /* Gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 600px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card-panel {
            padding: 20px;
        }

        .card-title {
            font-weight: bold;
        }

        .btn {
            background-color: #26a69a;
        }

        .file-input {
            margin-top: 20px;
        }

        .section {
            margin-top: 20px;
        }

        pre {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
        }

        .switch input[type="checkbox"] {
            margin-top: 10px;
        }

        #download-link {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h4 class="card-title">Convert CUE to LRC or TXT</h4>
        <p>Upload a `.cue` file, adjust the settings, and convert it to a `.lrc` or `.txt` file.</p>

        <!-- File upload -->
        <div class="file-input">
            <input type="file" id="cue-file" accept=".cue" class="file-path" />
        </div>

        <!-- Flags -->
        <div class="section">
            <label>
                <input type="checkbox" id="fix-performer-position" />
                <span>Fix names to be Artist - Track Name Format</span>
            </label><br>
            <label>
                <span>Choose output format:</span>
                <div class="switch">
                    <label>
                        TXT
                        <input type="checkbox" id="lrc-switch">
                        <span class="lever"></span>
                        LRC
                    </label>
                </div>
            </label>
        </div>

        <!-- Output preview and download -->
        <h5>Converted Output:</h5>
        <pre id="output-preview"></pre>

        <a id="download-link" class="btn" href="#" download="output.lrc">Download Result</a>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script>
        // Trigger conversion on file upload or settings change
        document.getElementById('cue-file').addEventListener('change', triggerConversion);
        document.getElementById('fix-performer-position').addEventListener('change', triggerConversion);
        document.getElementById('lrc-switch').addEventListener('change', triggerConversion);

        function triggerConversion() {
            const fileInput = document.getElementById('cue-file');
            const file = fileInput.files[0];

            if (!file) return; // If no file is uploaded, do nothing

            const reader = new FileReader();
            reader.onload = function (e) {
                const cueText = e.target.result;
                const fixPerformerPosition = document.getElementById('fix-performer-position').checked;
                const isLrcFormat = document.getElementById('lrc-switch').checked; // LRC is true when the switch is on
                const result = cueToLrc(cueText, fixPerformerPosition, isLrcFormat);

                // Display output preview on screen
                const outputPreview = document.getElementById('output-preview');
                outputPreview.textContent = result;

                // Create Blob for download
                const blob = new Blob([result], { type: 'text/plain' });
                const downloadLink = document.getElementById('download-link');
                
                // Set the download filename based on the uploaded CUE file name (replace .cue with .lrc or .txt)
                const baseFilename = file.name.replace('.cue', '');
                const fileExtension = isLrcFormat ? '.lrc' : '.txt';
                downloadLink.href = URL.createObjectURL(blob);
                downloadLink.style.display = 'block';
                downloadLink.download = `${baseFilename}${fileExtension}`;
            };
            reader.readAsText(file);
        }

        function cueToLrc(cueText, fixPerformerPositionFlag, isLrcFormat) {
            const cueLines = cueText.split('\n');
            let lrcLines = [];
            let currentTitle = "";
            let currentPerformer = "";

            cueLines.forEach((line) => {
                line = line.trim();
                if (line.startsWith("TITLE")) {
                    currentTitle = line.match(/"([^"]+)"/)[1];
                } else if (line.startsWith("PERFORMER")) {
                    currentPerformer = line.match(/"([^"]+)"/)[1];
                } else if (line.startsWith("INDEX 01")) {
                    const match = line.match(/INDEX 01 (\d+):(\d+):(\d+)/);
                    if (match) {
                        let [_, hh, mm, ss] = match;
                        hh = parseInt(hh);
                        mm = parseInt(mm);
                        ss = parseInt(ss);
                        let timestamp = '';

                        if (isLrcFormat) {
                            timestamp = `[${(mm + hh * 60).toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}.00]`;
                        } else {
                            timestamp = `[${hh.toString().padStart(2, '0')}:${mm.toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}]`;
                        }

                        let lrcLine = fixPerformerPositionFlag
                            ? `${timestamp} ${currentPerformer} - ${currentTitle}`
                            : `${timestamp} ${currentTitle} - ${currentPerformer}`;

                        lrcLines.push(lrcLine);

                        currentTitle = "";
                        currentPerformer = "";
                    }
                }
            });

            return lrcLines.join('\n');
        }
    </script>
</body>

</html>
